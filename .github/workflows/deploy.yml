# On every push to main: run the unit tests, then update the AWS server
# (git checkout origin/main, DB backup, rebuild, migrations). Setup: stegastiko/deploy/DEPLOY.md, step 9.
# Pull requests to main run the tests only.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 3.123.255.235
  SITE_URL: https://3-123-255-235.sslip.io

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stegastiko
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: stegastiko/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -t ed25519 "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The server's authorized_keys pins this key to the deploy command (DEPLOY.md, step 9).
          ssh -i ~/.ssh/deploy "ubuntu@$DEPLOY_HOST"

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "$SITE_URL/login/"; then
              echo "Site is up: $SITE_URL"
              exit 0
            fi
            sleep 6
          done
          echo "Site did not answer at $SITE_URL" >&2
          exit 1
