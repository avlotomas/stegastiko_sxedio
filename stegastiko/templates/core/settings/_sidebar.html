<aside class="case-work-layout__aside" aria-label="Ενότητες ρυθμίσεων">
    <div class="card case-actions-sidebar">
        <h2 class="card__title case-actions-sidebar__title">Ρυθμίσεις</h2>
        <p class="text-muted case-actions-sidebar__hint">Εμφανίζονται οι οθόνες που επιτρέπουν οι ρόλοι σας.</p>
        <nav class="case-actions-nav">
            {% for item in settings_nav %}
            <a
                href="{{ item.url }}"
                class="case-actions-nav__link{% if item.is_active %} is-active{% endif %}"
                {% if item.is_active %}aria-current="page"{% endif %}
            >
                <span class="case-actions-nav__label">{{ item.label }}</span>
            </a>
            {% endfor %}
        </nav>
    </div>
</aside>
