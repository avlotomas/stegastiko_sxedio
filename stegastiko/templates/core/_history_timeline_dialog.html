<dialog id="history-timeline-dialog"
        class="modal modal--wide modal--timeline"
        aria-labelledby="history-timeline-dialog-title"
        data-history-timeline-dialog>
    <div class="approved-design-plots-workspace__header">
        <div>
            <h2 class="card__title" id="history-timeline-dialog-title">
                Ιστορικό αλλαγών{% if timeline_subject %} — {{ timeline_subject }}{% endif %}
            </h2>
            <p class="text-muted">Χρονολόγιο των αλλαγών που έγιναν στην αίτηση και από ποιον χρήστη (§Β.1.3).</p>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" data-dialog-close>Κλείσιμο</button>
    </div>
    <div data-history-timeline-status></div>
    <div data-history-timeline-body>
        <p class="text-muted">Φόρτωση…</p>
    </div>
</dialog>
<script>
(function () {
    "use strict";
    if (window.__historyTimelineBound) {
        return;
    }
    window.__historyTimelineBound = true;
    document.addEventListener("click", function (event) {
        const open = event.target.closest("[data-history-timeline-open]");
        if (!open) {
            return;
        }
        event.preventDefault();
        const dialog = document.getElementById("history-timeline-dialog");
        const body = dialog ? dialog.querySelector("[data-history-timeline-body]") : null;
        const statusEl = dialog ? dialog.querySelector("[data-history-timeline-status]") : null;
        if (!dialog || !body) {
            return;
        }
        if (statusEl) {
            statusEl.innerHTML = "";
        }
        body.innerHTML = '<p class="text-muted">Φόρτωση…</p>';
        if (!dialog.open) {
            if (typeof dialog.showModal === "function") {
                dialog.showModal();
            } else {
                dialog.setAttribute("open", "");
            }
        }
        fetch(open.dataset.historyTimelineOpen, {
            headers: { Accept: "application/json" },
            credentials: "same-origin",
        })
            .then(function (response) {
                if (!response.ok) {
                    throw new Error("bad status");
                }
                return response.json();
            })
            .then(function (data) {
                if (!data || !data.ok) {
                    throw new Error("bad response");
                }
                body.innerHTML = data.timeline_html;
                if (typeof window.refreshUiTexts === "function") {
                    window.refreshUiTexts(body);
                }
            })
            .catch(function () {
                body.innerHTML = "";
                if (statusEl) {
                    statusEl.innerHTML = '<div class="alert alert--error" role="status">Αποτυχία φόρτωσης του ιστορικού αλλαγών.</div>';
                }
            });
    });
})();
</script>
